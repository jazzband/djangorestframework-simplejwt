name: Generate locale update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locale-updater:
    if: github.repository == 'jazzband/djangorestframework-simplejwt'
    name: Locale updater
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          sudo apt-get install -y gettext 
          python -m pip install --upgrade pip wheel setuptools
          pip install -e .[dev]

      - name: Run locale Update Script
        working-directory:
          rest_framework_simplejwt
        run: python ../scripts/i18n_updater.py

      - name: Prepare locale patch
        id: locale
        run: |
          git add --intent-to-add -- rest_framework_simplejwt/locale
          git diff --binary -- rest_framework_simplejwt/locale > locale-update.patch
          if test -s locale-update.patch; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save locale patch
        if: steps.locale.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locale-update
          path: locale-update.patch
          if-no-files-found: error
