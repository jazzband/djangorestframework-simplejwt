name: Release

on:
  push:
    tags:
    - '*'

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'jazzband/djangorestframework-simplejwt'
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get install -y gettext 
          python -m pip install -U pip
          python -m pip install -U setuptools twine wheel
          pip install -e .[dev]

      - name: Check locale
        working-directory: rest_framework_simplejwt
        run: |
          echo "Checking if locale files need updating. If they do, cd rest_framework_simplejwt && run python ../scripts/i18n_updater.py"
          python ../scripts/i18n_updater.py
          git diff --exit-code

      - name: Build package
        run: |
          python setup.py --version
          python setup.py sdist --format=gztar bdist_wheel
          twine check dist/*

      - name: Save package artifacts
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  upload:
    needs: build
    if: github.repository == 'jazzband/djangorestframework-simplejwt' && startsWith(github.ref, 'refs/tags/') && needs.build.outputs.artifact-id != ''
    runs-on: ubuntu-latest
    permissions: {}
    environment: jazzband-upload
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist/

      - name: Upload packages to Jazzband
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: jazzband
          password: ${{ secrets.JAZZBAND_RELEASE_KEY }}
          repository-url: https://jazzband.co/projects/djangorestframework-simplejwt/upload
          attestations: false
